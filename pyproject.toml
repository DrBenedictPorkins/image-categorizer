[project]
name = "image-categorizer"
version = "0.1.0"
description = "Image categorization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "numpy>=2.5.0",
    "psutil>=7.2.2",
    "accelerate>=1.15.0",
    "openai>=3.19.2",
    "huggingface_hub>=1.5.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "PyYAML>=6.0.3",
    "pillow-heif>=1.8.0",
]

[tool.setuptools.packages.find]
exclude = ["trash", "activate", "fix_scripts", "test_scripts"]
